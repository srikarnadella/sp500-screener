name: CI

# Every push and PR: run the tests, then build every page from synthetic --demo data (no network),
# so a broken change fails here instead of in the next scheduled daily run. Deploys stay in
# daily-screen.yml; GitHub Pages publishes whatever that job commits.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: |
          python test_screener.py
          python test_dip.py
          python test_ml_respect.py
          python test_econ_calendar.py
          python test_dashboard.py

      - name: Smoke test (build all pages offline)
        run: |
          python screener.py --demo --out "$RUNNER_TEMP/site"
          python dip_backtest.py --demo --null-series 20 --out "$RUNNER_TEMP/site"
          python dashboard.py --out "$RUNNER_TEMP/site" --alert "$RUNNER_TEMP/alert.md"
          ls "$RUNNER_TEMP/site"
