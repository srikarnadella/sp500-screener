name: Daily S&P 500 screen

on:
  schedule:
    # 14:00 and 22:00 UTC, Mon-Fri = 9:00am and 5:00pm EST.
    # GitHub Actions cron is fixed UTC year-round (no DST), so during EDT
    # (mid-Mar to early Nov) these land at 10:00am and 6:00pm local clock time.
    - cron: "0 14,22 * * 1-5"
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write      # lets the job commit the refreshed report

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: |
          python test_screener.py
          python test_dip.py

      - name: Run S&P 500 screener
        run: python screener.py

      - name: Run dip research (portfolio + sector peers)
        run: python dip_backtest.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add docs data
          if git diff --staged --quiet; then
            echo "No changes to commit (market closed?)"
          else
            git commit -m "Daily screen $(date -u +%F)"
            git pull --rebase
            git push
          fi
