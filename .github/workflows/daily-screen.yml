name: Daily S&P 500 screen

on:
  schedule:
    # 13:07 and 21:07 UTC, Mon-Fri = 9:07am and 5:07pm EDT.
    # GitHub Actions cron is fixed UTC (no DST): switch to "7 14,22" when EST
    # starts in early Nov, back to "7 13,21" in mid-Mar. Off the :00 mark
    # because GitHub delays/drops top-of-hour scheduled runs the most.
    - cron: "7 13,21 * * 1-5"
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write      # lets the job commit the refreshed report
  issues: write        # lets the job open an alert issue (GitHub emails you about it)

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: |
          python test_screener.py
          python test_dip.py
          python test_ml_respect.py
          python test_econ_calendar.py
          python test_dashboard.py

      - name: Build market calendar (econ releases, FOMC, earnings)
        run: python econ_calendar.py

      - name: Run S&P 500 screener
        run: python screener.py

      - name: Run dip research (portfolio + sector peers)
        run: python dip_backtest.py

      - name: Build merged dashboard
        run: python dashboard.py --alert alert.md

      # No `if: always()`: when any step fails, publish nothing rather than a mix of fresh and
      # stale pages. The stale-data banner on each page makes a missed day visible.
      - name: Commit results
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add docs data
          if git diff --staged --quiet; then
            echo "No changes to commit (market closed?)"
          else
            git commit -m "Daily screen $(TZ=America/New_York date +%F)"
            git pull --rebase
            git push
          fi

      # One issue per data date: the evening run and next morning's run see the same close,
      # so the second one finds the existing issue and skips.
      - name: Open an issue for alerts
        if: hashFiles('alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(head -n 1 alert.md)"
          if gh issue list --state all --search "\"$title\" in:title" --json title -q '.[].title' | grep -qxF "$title"; then
            echo "Already opened: $title"
          else
            tail -n +3 alert.md > body.md
            gh issue create --title "$title" --body-file body.md
          fi
